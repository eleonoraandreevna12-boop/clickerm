name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Create project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_TC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.triggerclicker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.triggerclicker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_TC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_TC'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="Кликер" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service android:name=".OverlayService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>

                  <service android:name=".ClickerAccessibility" android:exported="true"
                      android:label="Кликер"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF_TC
          mkdir -p app/src/main/java/com/example/triggerclicker
          cat > app/src/main/java/com/example/triggerclicker/ClickerAccessibility.kt <<'EOF_TC'
          package com.example.triggerclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          class ClickerAccessibility : AccessibilityService() {
              companion object {
                  @Volatile var inst: ClickerAccessibility? = null
              }

              private val h = Handler(Looper.getMainLooper())

              override fun onServiceConnected() { inst = this }
              override fun onUnbind(intent: Intent?): Boolean { inst = null; return super.onUnbind(intent) }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun tap(x: Float, y: Float, onResult: (Boolean) -> Unit) {
                  h.post {
                      val path = Path().apply { moveTo(x, y) }
                      val g = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 40))
                          .build()
                      val cb = object : AccessibilityService.GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) { onResult(true) }
                          override fun onCancelled(gestureDescription: GestureDescription?) { onResult(false) }
                      }
                      val ok = dispatchGesture(g, cb, null)
                      if (!ok) onResult(false)
                  }
              }
          }
          EOF_TC
          mkdir -p app/src/main/java/com/example/triggerclicker
          cat > app/src/main/java/com/example/triggerclicker/MainActivity.kt <<'EOF_TC'
          package com.example.triggerclicker

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var tol: EditText
              private lateinit var pre: EditText
              private lateinit var cool: EditText
              private lateinit var adapt: CheckBox
              private lateinit var disappear: CheckBox
              private lateinit var lvlF: EditText

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sp = getSharedPreferences("kl", MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  fun text(t: String) = TextView(this).apply { text = t }.also { root.addView(it) }
                  fun field(label: String, def: String): EditText {
                      text(label)
                      return EditText(this).apply {
                          setText(def); inputType = android.text.InputType.TYPE_CLASS_NUMBER
                      }.also { root.addView(it) }
                  }
                  fun btn(t: String, f: () -> Unit) =
                      Button(this).apply { text = t; setOnClickListener { f() } }.also { root.addView(it) }

                  text("Кликер: нажатие в момент касания двух цветов (стрелка и зона) или по одному цвету")
                  tol = field("Допуск цвета (0-255)", sp.getInt("tol", 25).toString())
                  pre = field("Задержка до клика, мс", sp.getLong("pre", 0L).toString())
                  cool = field("Пауза после нажатия, мс (для стрелки и зоны 400-800)", sp.getLong("cool", 150L).toString())
                  lvlF = field("Скорость стрелки на старте, 1-5 (после каждого попадания растёт сама)", sp.getInt("lvl", 1).toString())
                  adapt = CheckBox(this).apply { text = "Адаптация к задержке (повтор клика)"; isChecked = sp.getBoolean("adapt", true) }
                  root.addView(adapt)
                  disappear = CheckBox(this).apply { text = "Режим: кликать, когда цвет ИСЧЕЗ"; isChecked = sp.getBoolean("disappear", false) }
                  root.addView(disappear)

                  btn("1. Разрешить поверх других окон") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  btn("2. Включить «Спецвозможности» (Кликер)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  btn("3. Запустить") { launch() }

                  text("\nПосле запуска появится кружок, он остаётся поверх всех приложений.\n\n" +
                       "• Тап по кружку — старт / стоп.\n" +
                       "• Удержание — меню: 💧 пипетка с лупой (в режиме ⚡ два шага: сначала стрелка, потом зона), " +
                       "🎯 прицел (круг вокруг дуги: в круг должны попадать и стрелка, и зона), 🔍 размер кружка, ⚡ режим (два цвета / один цвет), " +
                       "⏪ ⏩ упреждение: ⏪ жмёт раньше, ⏩ позже, ✕ выход.\n" +
                       "• Внизу кружка при работе три точки: видно ли стрелку, готово ли слежение (зелёная), видно ли зону.\n" +
                       "• Круг должен охватывать зону и дугу вокруг неё примерно на ±45°: стрелку надо увидеть заранее, за ~150 мс до зоны.\n" +
                       "• Скорость стрелки считается по шагам, разворот на краю замечается сразу, упреждение подстраивается само по месту остановки стрелки.\n" +
                       "• Сохранённые цвета — точки вокруг кружка. Тап — выбрать, удержание — удалить.")
                  setContentView(ScrollView(this).apply { addView(root) })

                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
              }

              private fun launch() {
                  if (!Settings.canDrawOverlays(this)) { toast("Сначала шаг 1"); return }
                  if (ClickerAccessibility.inst == null) { toast("Сначала шаг 2"); return }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), 42)
              }

              @Deprecated("simple")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 42 && res == RESULT_OK && data != null) {
                      val t = tol.text.toString().toIntOrNull() ?: 25
                      val p = pre.text.toString().toLongOrNull() ?: 0L
                      val c = cool.text.toString().toLongOrNull() ?: 150L
                      val lv = (lvlF.text.toString().toIntOrNull() ?: 1).coerceIn(1, 5)
                      getSharedPreferences("kl", MODE_PRIVATE).edit()
                          .putInt("tol", t).putLong("pre", p).putLong("cool", c).putInt("lvl", lv)
                          .putBoolean("adapt", adapt.isChecked).putBoolean("disappear", disappear.isChecked)
                          .apply()
                      val i = Intent(this, OverlayService::class.java)
                          .putExtra("code", res).putExtra("data", data)
                          .putExtra("tol", t).putExtra("pre", p).putExtra("cool", c).putExtra("lvl", lv)
                          .putExtra("adapt", adapt.isChecked)
                          .putExtra("disappear", disappear.isChecked)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF_TC
          mkdir -p app/src/main/java/com/example/triggerclicker
          cat > app/src/main/java/com/example/triggerclicker/OverlayService.kt <<'EOF_TC'
          package com.example.triggerclicker

          import android.animation.ValueAnimator
          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          // =====================================================================================
          //  НАСТРОЙКИ ТОЧНОСТИ (всё, что можно подкрутить, собрано здесь)
          //  Что измерено по видео: стрелка крутится вокруг неподвижной оси, идёт с ПОСТОЯННОЙ скоростью между
          //  краями примерно ±58° и мгновенно разворачивается на краю. После каждого попадания скорость растёт,
          //  а зона сужается. Игра обновляет стрелку реже, чем идут кадры записи экрана: часть кадров одинаковая.
          //
          //  КАК ЭТО РАБОТАЕТ: линия стрелки всегда проходит через ось качания. Когда стрелка «совпала» с зоной,
          //  эта линия проходит через центр зоны. Поэтому следим за одной величиной e = расстояние (со знаком, px)
          //  от центра зоны до линии стрелки. e = 0 — стрелка точно на зоне. Ось и углы искать не нужно.
          // =====================================================================================
          private object Tune {
              // --- пять скоростей стрелки, °/с ---
              // Первые четыре измерены по видео: 170, 203, 238, 275 (шаг растёт: +34, +35, +37).
              // Пятая — оценка по тому же тренду: 275 + ~38 ≈ 312 °/с. Если в игре иначе — поправь число.
              // Используется как подсказка: после каждого попадания скорость ждём в нужное число раз больше.
              val SPEED_DEG_S = floatArrayOf(170f, 203f, 238f, 275f, 312f)

              // --- чувствительность зрения ---
              const val MIN_COLOR_TOL = 40        // минимальный допуск цвета (0-255). Мало цвета найдено -> больше; ловит фон -> меньше
              const val TRACK_MIN_PX = 6          // пикселей стрелки, чтобы горела точка «вижу стрелку»
              const val LINE_MIN_PX = 15          // пикселей стрелки, чтобы провести через них линию
              const val LINE_MIN_ELONG = 8.0      // линия должна быть вытянутой (длина/толщина), иначе это не стрелка
              const val ZONE_MIN_PX = 25          // пикселей зоны, чтобы считать зону найденной

              // --- слежение за траекторией (e в пикселях экрана) ---
              const val DUP_PX = 2.0f             // изменение e меньше этого = «тот же кадр». Больше -> меньше шума, но грубее
              const val GAP_RESET_MS = 250        // стрелку не видно дольше этого -> новый проход, старое забыто
              const val REGRESS_MIN_TICKS = 3     // сколько шагов нужно, чтобы пересчитать скорость
              const val SWEEP_MIN_TICKS = 2       // сколько шагов после разворота нужно, чтобы уже целиться
              const val SPEED_EMA = 0.35          // как быстро скорость подстраивается (0.1 плавно ... 0.6 резко)
              const val SPEED_OUTLIER = 0.4       // измерение, отличающееся от прежней скорости больше чем на 40%, пропускаем
              const val SPEED_E_FRAC = 0.6f       // скорость пересчитываем, пока стрелка ближе этой доли радиуса круга к зоне
              const val SPEED_MIN_PX_S = 60f      // медленнее этого стрелкой не считаем

              // --- время нажатия ---
              const val COMMIT_MS = 45            // за сколько мс до нажатия «фиксируем» момент и ждём точно. Не меньше шага кадров игры
              const val LATE_TOL_FRAC = 0.5       // можно опоздать не больше этой доли от полуширины зоны (в мс), иначе ждём следующий проход
              const val LEAD_STEP_MS = 5          // шаг кнопок ⏪ ⏩
              const val LEAD_MAX_MS = 300

              // --- самонастройка упреждения по месту остановки стрелки ---
              const val CAL_GAIN = 0.3            // 0 = выключить самонастройку, 0.5 = быстро, но шумно
              const val CAL_MAX_ERR_MS = 120.0    // ошибки больше этой считаем случайностью
              const val CAL_STILL_MS = 120        // стрелка не двигалась столько мс = остановилась
              const val MISS_AFTER_MS = 350       // стрелка всё ещё бежит через столько мс после нажатия = промах
              const val MISS_OUT_MS = 700         // стрелка пропала из круга, а зона не сменилась за столько мс = промах
          }

          class OverlayService : Service() {
              private class Act(val label: String, val bg: Int, val deg: Int, val onClick: () -> Unit)

              private val ui = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var vd: VirtualDisplay? = null
              private var cur: Image? = null
              private val lock = Any()
              private var W = 0
              private var H = 0
              private var dpi = 0

              // круг-детектор, точка нажатия, кружок-меню (px)
              private var fx = 300; private var fy = 300; private var fw = 160; private var fh = 160
              private var tx = 700; private var ty = 500
              private var hudX = Int.MIN_VALUE; private var hudY = 0
              private var bubbleStep = 1
              @Volatile private var offX = 0
              @Volatile private var offY = 0
              @Volatile private var color = Color.RED
              @Volatile private var color2 = Color.YELLOW
              @Volatile private var contactMode = true
              @Volatile private var leadMs = 80
              @Volatile private var seenN = false
              @Volatile private var seenZ = false
              private var pipStep = 1
              @Volatile private var running = false
              @Volatile private var alive = true
              @Volatile private var lat = -1.0
              @Volatile private var clicks = 0
              @Volatile private var tapOk = 0
              @Volatile private var tapFail = 0
              @Volatile private var hits = 0
              @Volatile private var misses = 0

              private var tol = 25; private var pre = 0L; private var cool = 150L
              private var adapt = true; private var wantPresent = true

              // режим «контакт двух цветов»: стрелка + зона
              private val nxs = IntArray(4000)
              private val nys = IntArray(4000)
              private val zxs = IntArray(8000)
              private val zys = IntArray(8000)
              private var rowBuf = ByteArray(4096)
              private var aTs = 0L
              private var aZn = 0
              private var aNn = 0
              private var aZx = 0f
              private var aZy = 0f
              private var prevZx = -1f
              private var prevZy = -1f
              private var waitChange = false
              private var lastZx = 0f
              private var lastZy = 0f
              private var calibPending = false
              private var lastSpeed = 0f
              private var fireNs = 0L
              private var blockUntilNs = 0L

              // ---- линия стрелки и зона (ось качания не нужна) ----
              private var aHaveE = false
              private var aE = 0f           // e: расстояние от центра зоны до линии стрелки со знаком, px
              private var aHalfPx = 8f      // полуширина зоны поперёк стрелки, px
              private var zLim = 0f
              private var prevUx = 0.0      // направление линии в прошлом кадре: держим знак e постоянным
              private var prevUy = -1.0

              // ---- траектория: шаги стрелки с последнего разворота ----
              private var lastE = Float.NaN
              private var swDir = 0         // знак изменения e: +1 / -1, 0 пока неизвестно
              private val tkT = LongArray(8)
              private val tkE = FloatArray(8)
              private var tkN = 0
              private var lastTickNs = 0L
              private var speed = 0f        // скорость e около зоны, px/с (сглаженная)
              private var speedN = 0
              private var speedRej = 0
              private var speedPrior = 0f   // догадка о скорости на новом уровне
              private var lvl = 0           // номер скорости 0..4 (на экране 1..5)
              private var startLvl = 0
              private var turns = 0
              private var lateNoted = false
              @Volatile private var skippedLate = 0
              @Volatile private var ready = false
              @Volatile private var framesAll = 0
              @Volatile private var framesLine = 0

              // ---- что было в момент последнего нажатия (для самонастройки) ----
              private var fireDir = 0
              private var fireSpeed = 0f

              private val palette = ArrayList<Int>()
              private var aiming = true
              private var expanded = false
              private val menuViews = ArrayList<View>()
              private var pipette: PipetteView? = null
              private val menuClose = Runnable { collapse() }

              private lateinit var frameV: View
              private lateinit var frameP: WindowManager.LayoutParams
              private lateinit var moveH: Handle
              private lateinit var sizeH: Handle
              private lateinit var targetH: Handle
              private lateinit var hudRoot: FrameLayout
              private lateinit var hudP: WindowManager.LayoutParams
              private lateinit var bubble: BubbleView

              private fun bubbleSize(): Int =
                  (resources.displayMetrics.density * intArrayOf(44, 56, 72)[bubbleStep.coerceIn(0, 2)]).toInt()

              private val S: Int
                  get() = (bubbleSize() * 0.6f).toInt()

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, id: Int): Int {
                  if (i == null || projection != null) return START_NOT_STICKY
                  tol = i.getIntExtra("tol", 25)
                  pre = i.getLongExtra("pre", 0)
                  cool = i.getLongExtra("cool", 150)
                  adapt = i.getBooleanExtra("adapt", true)
                  wantPresent = !i.getBooleanExtra("disappear", false)
                  startLvl = (i.getIntExtra("lvl", 1) - 1).coerceIn(0, 4)
                  startFg()
                  load()

                  val code = i.getIntExtra("code", 0)
                  @Suppress("DEPRECATION")
                  val data: Intent = (if (Build.VERSION.SDK_INT >= 33)
                      i.getParcelableExtra("data", Intent::class.java) else i.getParcelableExtra("data")) ?: run {
                      stopSelf(); return START_NOT_STICKY
                  }
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(code, data).also {
                      it.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() { ui.post { stopSelf() } }
                      }, ui)
                  }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  setupCapture()
                  if (hudX == Int.MIN_VALUE) { hudX = W - bubbleSize(); hudY = H / 3 }
                  clampAll()
                  buildOverlay()
                  Thread {
                      android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_DISPLAY)
                      loop()
                  }.apply { isDaemon = true; start() }
                  tickStatus()
                  toast("Тап по кружку — старт/стоп. Удержание — меню.")
                  return START_NOT_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("tc", "Кликер", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "tc")
                      .setContentTitle("Кликер работает")
                      .setSmallIcon(android.R.drawable.ic_menu_compass).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
              }

              private var curToast: Toast? = null

              private fun toast(s: String) {
                  ui.post {
                      curToast?.cancel()
                      curToast = Toast.makeText(this, s, Toast.LENGTH_SHORT)
                      curToast?.show()
                  }
              }

              private fun keepMenu() {
                  ui.removeCallbacks(menuClose)
                  ui.postDelayed(menuClose, 7000)
              }

              // ---------- сохранение настроек и палитры ----------
              private fun prefs() = getSharedPreferences("kl", MODE_PRIVATE)

              private fun load() {
                  val p = prefs()
                  aiming = !p.contains("fx")
                  fx = p.getInt("fx", fx); fy = p.getInt("fy", fy); fw = p.getInt("fw", fw); fh = fw
                  tx = p.getInt("tx", tx); ty = p.getInt("ty", ty)
                  hudX = p.getInt("hx", Int.MIN_VALUE); hudY = p.getInt("hy", 0)
                  bubbleStep = p.getInt("bs", 1)
                  color = p.getInt("color", Color.RED)
                  color2 = p.getInt("c2", Color.YELLOW)
                  contactMode = p.getBoolean("cm", true)
                  leadMs = p.getInt("lead", 80)
                  palette.clear()
                  for (s in (p.getString("pal", "") ?: "").split(",")) {
                      val v = s.toIntOrNull()
                      if (v != null) palette.add(v)
                  }
              }

              private fun save() {
                  prefs().edit()
                      .putInt("fx", fx).putInt("fy", fy).putInt("fw", fw)
                      .putInt("tx", tx).putInt("ty", ty)
                      .putInt("hx", hudX).putInt("hy", hudY)
                      .putInt("bs", bubbleStep).putInt("color", color)
                      .putInt("c2", color2).putBoolean("cm", contactMode).putInt("lead", leadMs)
                      .putString("pal", palette.joinToString(","))
                      .apply()
              }

              private fun near(a: Int, b: Int): Boolean =
                  abs(Color.red(a) - Color.red(b)) < 12 && abs(Color.green(a) - Color.green(b)) < 12 &&
                      abs(Color.blue(a) - Color.blue(b)) < 12

              private fun addPalette(c: Int) {
                  palette.removeAll { near(it, c) }
                  palette.add(0, c)
                  while (palette.size > 8) palette.removeAt(palette.size - 1)
              }

              // ---------- захват экрана ----------
              @Suppress("DEPRECATION")
              private fun setupCapture() {
                  val dm = DisplayMetrics()
                  (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  val oldW = W
                  val oldH = H
                  W = dm.widthPixels; H = dm.heightPixels; dpi = dm.densityDpi
                  synchronized(lock) { cur?.close(); cur = null }
                  val old = reader
                  reader = ImageReader.newInstance(W, H, PixelFormat.RGBA_8888, 3)
                  if (vd == null) {
                      vd = projection!!.createVirtualDisplay("tc", W, H, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null)
                  } else {
                      vd!!.resize(W, H, dpi)
                      vd!!.surface = reader!!.surface
                  }
                  old?.close()

                  // при повороте экрана переносим всё в видимую область
                  if (oldW > 0 && (oldW != W || oldH != H) && ::hudRoot.isInitialized) {
                      collapse(false)
                      fx = fx * W / oldW; fy = fy * H / oldH
                      tx = tx * W / oldW; ty = ty * H / oldH
                      hudX = hudX * W / oldW; hudY = hudY * H / oldH
                      clampAll()
                      hudX = if (hudX + bubbleSize() / 2 < W / 2) 0 else W - bubbleSize()
                      relayoutAll()
                      resetSweep(); speed = 0f; speedN = 0; speedPrior = 0f // после поворота экрана пиксели другие
                  }
              }

              private fun clampAll() {
                  val b = bubbleSize()
                  fw = fw.coerceIn(60, max(60, W - 2 * S))
                  fh = fh.coerceIn(60, max(60, H - 2 * S))
                  fx = fx.coerceIn(S, max(S, W - fw - S))
                  fy = fy.coerceIn(S, max(S, H - fh - S))
                  tx = tx.coerceIn(S / 2, max(S / 2, W - S / 2))
                  ty = ty.coerceIn(S / 2, max(S / 2, H - S / 2))
                  val sq = min(fw, fh)
                  fw = sq; fh = sq
                  hudX = hudX.coerceIn(0, max(0, W - b))
                  hudY = hudY.coerceIn(0, max(0, H - b))
              }

              override fun onConfigurationChanged(c: Configuration) {
                  super.onConfigurationChanged(c)
                  if (projection != null) ui.postDelayed({ setupCapture() }, 300)
              }

              private fun refresh() {
                  val n = try { reader?.acquireLatestImage() } catch (e: Exception) { null }
                  if (n != null) { cur?.close(); cur = n }
              }

              private fun px(x: Int, y: Int): Int {
                  val im = cur ?: return 0
                  if (x < 0 || y < 0 || x >= im.width || y >= im.height) return 0
                  val p = im.planes[0]
                  val o = y * p.rowStride + x * p.pixelStride
                  val b = p.buffer
                  if (o + 2 >= b.limit()) return 0
                  return Color.rgb(b.get(o).toInt() and 255, b.get(o + 1).toInt() and 255, b.get(o + 2).toInt() and 255)
              }

              private fun vivid(c: Int): Float {
                  val r = Color.red(c)
                  val g = Color.green(c)
                  val b = Color.blue(c)
                  val mx = max(r, max(g, b))
                  val mn = min(r, min(g, b))
                  if (mx == 0) return 0f
                  return (mx - mn) / mx.toFloat() * (mx / 255f)
              }

              // берёт самый яркий и насыщенный пиксель рядом: так можно попасть в тонкую линию
              private fun smartPick(x: Int, y: Int): Int = synchronized(lock) {
                  refresh()
                  val center = px(x, y)
                  if (center == 0) return 0
                  var best = center
                  var bestV = vivid(center)
                  for (dy in -2..2) for (dx in -2..2) {
                      val p = px(x + dx, y + dy)
                      if (p == 0) continue
                      val v = vivid(p)
                      if (v > bestV) { bestV = v; best = p }
                  }
                  if (vivid(center) >= bestV * 0.85f) center else best
              }

              private fun grid(x: Int, y: Int, n: Int): IntArray = synchronized(lock) {
                  refresh()
                  IntArray(n * n) { i -> px(x + i % n - n / 2, y + i / n - n / 2) }
              }

              private fun match(): Boolean = synchronized(lock) {
                  refresh()
                  if (cur == null) return false
                  val bx = fx + offX
                  val by = fy + offY
                  val inset = 6
                  val nx = (fw - 2 * inset).coerceIn(8, 40) / 5
                  val ny = (fh - 2 * inset).coerceIn(8, 40) / 5
                  val c = color
                  val ccx = bx + fw / 2.0
                  val ccy = by + fh / 2.0
                  val rr = (fw - 2 * inset) / 2.0
                  for (i in 0..max(1, nx)) for (j in 0..max(1, ny)) {
                      val x = bx + inset + (fw - 2 * inset - 1) * i / max(1, nx)
                      val y = by + inset + (fh - 2 * inset - 1) * j / max(1, ny)
                      val ddx = x - ccx
                      val ddy = y - ccy
                      if (ddx * ddx + ddy * ddy > rr * rr) continue
                      val p = px(x, y)
                      if (abs(Color.red(p) - Color.red(c)) <= tol && abs(Color.green(p) - Color.green(c)) <= tol &&
                          abs(Color.blue(p) - Color.blue(c)) <= tol) return true
                  }
                  false
              }

              // ---------- движок ----------
              private fun click() {
                  val s = ClickerAccessibility.inst ?: return
                  clicks++
                  s.tap((tx + offX).toFloat(), (ty + offY).toFloat()) { ok ->
                      if (ok) { tapOk++ } else { tapFail++ }
                  }
              }

              private fun loop() {
                  while (alive) {
                      if (!running) { Thread.sleep(20); continue }
                      try {
                          if (contactMode) tickContact() else { tick(); Thread.sleep(1) }
                      } catch (e: Exception) { Thread.sleep(50) }
                  }
              }

              private fun tick() {
                  val want = wantPresent
                  if (match() != want) return
                  if (pre > 0) Thread.sleep(pre)
                  var retries = 0
                  while (running) {
                      val t0 = System.nanoTime()
                      click()
                      if (!adapt) break
                      val timeout = if (lat > 0) (lat * 1.6 + 20).coerceIn(40.0, 500.0) else 150.0
                      var ok = false
                      while ((System.nanoTime() - t0) / 1e6 < timeout) {
                          if (match() != want) { ok = true; break }
                          Thread.sleep(1)
                      }
                      if (ok) {
                          val d = (System.nanoTime() - t0) / 1e6
                          lat = if (lat < 0) d else lat * 0.8 + d * 0.2
                          break
                      }
                      if (++retries >= 3) break
                  }
                  while (running && match() == want) Thread.sleep(2)
                  Thread.sleep(cool)
              }


              // ---------- контакт двух цветов: стрелка + зона ----------

              // [ЗРЕНИЕ] Один кадр: находим пиксели стрелки и зоны. Из них получаем одну величину e —
              // расстояние (со знаком) от центра зоны до линии стрелки. e == 0 значит «стрелка на зоне».
              private fun analyzeFrame(): Int = synchronized(lock) {
                  val n = try { reader?.acquireLatestImage() } catch (e: Exception) { null }
                  if (n == null) return 0
                  cur?.close(); cur = n
                  val pl = n.planes[0]
                  val buf = pl.buffer
                  val rs = pl.rowStride
                  val ps = pl.pixelStride
                  val bx = fx + offX
                  val by = fy + offY
                  val x0 = max(0, bx)
                  val y0 = max(0, by)
                  val x1 = min(n.width, bx + fw)
                  val y1 = min(n.height, by + fh)
                  aTs = n.timestamp
                  aNn = 0; aZn = 0; aHaveE = false
                  if (x1 - x0 < 8 || y1 - y0 < 8) return 1
                  val need = (x1 - x0) * ps
                  if (rowBuf.size < need) rowBuf = ByteArray(need)

                  val t = max(tol, Tune.MIN_COLOR_TOL)
                  val ar = Color.red(color); val ag = Color.green(color); val ab = Color.blue(color)
                  val c2 = color2
                  val br = Color.red(c2); val bg = Color.green(c2); val bb = Color.blue(c2)
                  val cxm = bx + fw / 2f
                  val cym = by + fh / 2f
                  val rad = fw / 2f - 2f
                  val rad2 = rad * rad
                  var nn = 0
                  var nz = 0
                  for (y in y0 until y1) {
                      val dy = y - cym
                      val hw2 = rad2 - dy * dy
                      if (hw2 < 0f) continue
                      val hw = sqrt(hw2)
                      val xa = max(x0, (cxm - hw).toInt())
                      val xb = min(x1 - 1, (cxm + hw).toInt())
                      if (xb <= xa) continue
                      val off = y * rs + xa * ps
                      val len = (xb - xa + 1) * ps
                      if (off + len > buf.limit()) break
                      buf.position(off)
                      buf.get(rowBuf, 0, len)
                      var o = 0
                      var x = xa
                      while (x <= xb) {
                          val r = rowBuf[o].toInt() and 255
                          val g = rowBuf[o + 1].toInt() and 255
                          val b = rowBuf[o + 2].toInt() and 255
                          if (abs(r - ar) <= t && abs(g - ag) <= t && abs(b - ab) <= t) {
                              if (nn < nxs.size) { nxs[nn] = x; nys[nn] = y; nn++ }
                          } else if (abs(r - br) <= t && abs(g - bg) <= t && abs(b - bb) <= t) {
                              if (nz < zxs.size) { zxs[nz] = x; zys[nz] = y; nz++ }
                          }
                          o += ps
                          x++
                      }
                  }
                  aNn = nn; aZn = nz

                  // зона: центр (одиночные пиксели-помехи отбрасываем)
                  if (nz >= Tune.ZONE_MIN_PX) {
                      var sx = 0L; var sy = 0L
                      for (i in 0 until nz) { sx += zxs[i]; sy += zys[i] }
                      var cx = sx.toFloat() / nz
                      var cy = sy.toFloat() / nz
                      var sd = 0f
                      for (i in 0 until nz) sd += hypot(zxs[i] - cx, zys[i] - cy)
                      val lim = 2f * (sd / nz) + 5f
                      var sx2 = 0L; var sy2 = 0L; var n2 = 0
                      for (i in 0 until nz) {
                          if (hypot(zxs[i] - cx, zys[i] - cy) <= lim) { sx2 += zxs[i]; sy2 += zys[i]; n2++ }
                      }
                      if (n2 >= 10) { cx = sx2.toFloat() / n2; cy = sy2.toFloat() / n2 }
                      aZx = cx; aZy = cy; zLim = lim
                  }

                  // стрелка: линия по пикселям, потом e
                  if (nn >= Tune.TRACK_MIN_PX && nz >= Tune.ZONE_MIN_PX) analyzeNeedle(nn)
                  1
              }

              // [ЗРЕНИЕ] Линия стрелки: метод главных осей с отбраковкой выбросов (фон с похожим цветом).
              // Знак e держим постоянным: направление линии берём так, чтобы оно совпадало с прошлым кадром.
              private fun analyzeNeedle(nn: Int) {
                  var mx = 0.0; var my = 0.0
                  for (i in 0 until nn) { mx += nxs[i]; my += nys[i] }
                  mx /= nn; my /= nn
                  val lim = max(3.0, fw * 0.012)
                  var ux = 0.0; var uy = -1.0; var elong = 0.0; var cnt = nn
                  for (pass in 0..1) {
                      if (pass == 1) {
                          var sx = 0.0; var sy = 0.0; var c = 0
                          for (i in 0 until nn) {
                              if (abs((nxs[i] - mx) * uy - (nys[i] - my) * ux) <= lim) { sx += nxs[i]; sy += nys[i]; c++ }
                          }
                          if (c < Tune.LINE_MIN_PX) return
                          mx = sx / c; my = sy / c; cnt = c
                      }
                      var sxx = 0.0; var sxy = 0.0; var syy = 0.0
                      for (i in 0 until nn) {
                          val ex = nxs[i] - mx
                          val ey = nys[i] - my
                          if (pass == 1 && abs(ex * uy - ey * ux) > lim) continue
                          sxx += ex * ex; sxy += ex * ey; syy += ey * ey
                      }
                      val half = (sxx + syy) / 2.0
                      val rr = sqrt(((sxx - syy) / 2.0) * ((sxx - syy) / 2.0) + sxy * sxy)
                      val l1 = half + rr
                      val l2 = max(half - rr, 1e-3)
                      val a = 0.5 * atan2(2.0 * sxy, sxx - syy)
                      ux = cos(a); uy = sin(a); elong = l1 / l2
                  }
                  if (cnt < Tune.LINE_MIN_PX || elong < Tune.LINE_MIN_ELONG) return
                  if (ux * prevUx + uy * prevUy < 0.0) { ux = -ux; uy = -uy }
                  prevUx = ux; prevUy = uy
                  val nx = -uy
                  val ny = ux
                  aE = ((aZx - mx) * nx + (aZy - my) * ny).toFloat()
                  // полуширина зоны поперёк стрелки: нужна, чтобы знать, сколько мс можно ошибиться
                  var pmin = 1e9; var pmax = -1e9
                  for (i in 0 until aZn) {
                      if (hypot(zxs[i] - aZx, zys[i] - aZy) > zLim) continue
                      val p = (zxs[i] - aZx) * nx + (zys[i] - aZy) * ny
                      if (p < pmin) pmin = p
                      if (p > pmax) pmax = p
                  }
                  if (pmax > pmin) aHalfPx = max(2f, ((pmax - pmin) / 2.0).toFloat())
                  aHaveE = true
              }

              // [ТРАЕКТОРИЯ] Забываем текущий проход стрелки (после разворота-прыжка, нового раунда или пропажи стрелки).
              private fun resetSweep() {
                  tkN = 0; swDir = 0; lastE = Float.NaN; lateNoted = false
              }

              // Новый раунд (попали): стрелка ускорилась. Скорость учим заново, но с подсказкой из таблицы пяти скоростей.
              private fun newRound() {
                  val step = if (lvl < 4) Tune.SPEED_DEG_S[lvl + 1] / Tune.SPEED_DEG_S[lvl] else 1f
                  speedPrior = if (speed > 0f) speed * step else 0f
                  if (lvl < 4) lvl++
                  speed = 0f; speedN = 0; speedRej = 0
                  resetSweep()
              }

              private fun resetTracking() {
                  waitChange = false; blockUntilNs = 0L; prevZx = -1f
                  seenN = false; seenZ = false; calibPending = false
                  resetSweep()
                  speed = 0f; speedN = 0; speedRej = 0; speedPrior = 0f
                  lvl = startLvl
                  hits = 0; misses = 0; turns = 0; skippedLate = 0
                  framesAll = 0; framesLine = 0; ready = false
                  prevUx = 0.0; prevUy = -1.0
              }

              // [ТРАЕКТОРИЯ + РАЗВОРОТ + СКОРОСТЬ]
              // Вызывается для каждого кадра. Одинаковые кадры (игра обновляет стрелку реже, чем идёт запись) пропускаем.
              // Новый «шаг» стрелки:
              //  - знак изменения e поменялся -> РАЗВОРОТ: старая траектория забыта, скорость сохранена
              //  - стрелки не было видно дольше GAP_RESET_MS или e прыгнул больше диаметра круга -> новый проход
              //  - иначе точка добавляется в проход и пересчитывается скорость (наклон прямой e по времени)
              private fun trackTick(frameNs: Long, e: Float, nowNs: Long) {
                  if (!lastE.isNaN() && (nowNs - lastTickNs) / 1e6 > Tune.GAP_RESET_MS) resetSweep()
                  if (!lastE.isNaN()) {
                      val d = e - lastE
                      if (abs(d) < Tune.DUP_PX) return
                      if (abs(d) > fw) {
                          resetSweep()
                      } else {
                          val dir = if (d > 0f) 1 else -1
                          if (swDir != 0 && dir != swDir) { tkN = 0; turns++; lateNoted = false }
                          swDir = dir
                      }
                  }
                  lastE = e
                  lastTickNs = nowNs
                  if (tkN == tkT.size) {
                      for (i in 1 until tkT.size) { tkT[i - 1] = tkT[i]; tkE[i - 1] = tkE[i] }
                      tkN--
                  }
                  tkT[tkN] = frameNs; tkE[tkN] = e; tkN++

                  // скорость: МНК-наклон e по времени за последние шаги (пока стрелка не слишком далеко от зоны: там e почти линейно)
                  if (tkN >= Tune.REGRESS_MIN_TICKS && abs(e) < Tune.SPEED_E_FRAC * fw / 2f) {
                      val k = min(tkN, 6)
                      val s0 = tkN - k
                      var mt = 0.0; var me = 0.0
                      for (i in 0 until k) { mt += tkT[s0 + i]; me += tkE[s0 + i] }
                      mt /= k; me /= k
                      var num = 0.0; var den = 0.0
                      for (i in 0 until k) {
                          val dt = (tkT[s0 + i] - mt) / 1e9
                          num += dt * (tkE[s0 + i] - me); den += dt * dt
                      }
                      if (den > 0.0) {
                          val m = abs(num / den).toFloat()
                          if (m >= Tune.SPEED_MIN_PX_S) {
                              if (speedN == 0) {
                                  speed = if (speedPrior > 0f && abs(m - speedPrior) < 0.5f * speedPrior) 0.5f * speedPrior + 0.5f * m else m
                                  speedN++; speedRej = 0
                              } else if (abs(m - speed) < Tune.SPEED_OUTLIER * speed) {
                                  speed += (Tune.SPEED_EMA * (m - speed)).toFloat()
                                  speedN++; speedRej = 0
                              } else if (++speedRej >= 3) {
                                  speed = m; speedN = 1; speedRej = 0   // скорость реально сменилась (уровень вырос)
                              }
                              lastSpeed = speed
                          }
                      }
                  }
              }

              // скорость, которой сейчас можно верить (px/с), или 0
              private fun currentSpeed(): Float {
                  if (speedN > 0) return speed
                  if (speedPrior > 0f) return speedPrior
                  if (tkN >= 2) {
                      val dt = (tkT[tkN - 1] - tkT[tkN - 2]) / 1e9f
                      if (dt > 0f) return abs(tkE[tkN - 1] - tkE[tkN - 2]) / dt
                  }
                  return 0f
              }

              // точное ожидание до момента нажатия (сон до последних 3 мс, дальше активное ожидание)
              private fun waitUntil(tNs: Long) {
                  while (running) {
                      val rem = tNs - System.nanoTime()
                      if (rem <= 0L) return
                      if (rem > 3_000_000L) Thread.sleep(1) else Thread.yield()
                  }
              }

              private fun tickContact() {
                  if (analyzeFrame() == 0) { Thread.sleep(1); return }
                  val nowNs = System.nanoTime()
                  seenN = aNn >= Tune.TRACK_MIN_PX
                  seenZ = aZn >= Tune.ZONE_MIN_PX
                  // время кадра (если часы кадра и System.nanoTime не совпали — берём текущее)
                  val frameNs = if (aTs > 0 && abs(nowNs - aTs) < 500_000_000L) aTs else nowNs

                  // зона прыгнула -> новый раунд, старая траектория не нужна
                  if (seenZ && prevZx >= 0f && hypot(aZx - prevZx, aZy - prevZy) > 30f) resetSweep()
                  if (seenZ) { prevZx = aZx; prevZy = aZy } else prevZx = -1f

                  val haveE = aHaveE
                  framesAll++
                  if (haveE) { framesLine++; trackTick(frameNs, aE, nowNs) }
                  ready = haveE && swDir != 0 && currentSpeed() >= Tune.SPEED_MIN_PX_S

                  // самонастройка: после нажатия стрелка замирает; по месту остановки уточняем упреждение
                  if (calibPending) {
                      val dtMs = (nowNs - fireNs) / 1e6
                      if (dtMs > 900 || !seenZ) {
                          calibPending = false
                      } else if (haveE && dtMs > 60 && (nowNs - lastTickNs) / 1e6 >= Tune.CAL_STILL_MS) {
                          calibPending = false
                          if (fireSpeed >= Tune.SPEED_MIN_PX_S && Tune.CAL_GAIN > 0.0) {
                              // early > 0: стрелка остановилась ДО центра зоны -> нажали рано -> упреждение уменьшить
                              val early = -aE * fireDir
                              val errMs = early / fireSpeed * 1000.0
                              if (abs(errMs) < Tune.CAL_MAX_ERR_MS) {
                                  leadMs = (leadMs - errMs * Tune.CAL_GAIN).toInt().coerceIn(0, Tune.LEAD_MAX_MS)
                                  save()
                              }
                          }
                      }
                  }

                  // после нажатия ждём: зона сменилась (попали) или стрелка бежит дальше (промах)
                  if (waitChange) {
                      val moved = seenZ && hypot(aZx - lastZx, aZy - lastZy) > 25f
                      val dtMs = (nowNs - fireNs) / 1e6
                      val stillRunning = (haveE && dtMs > Tune.MISS_AFTER_MS && (nowNs - lastTickNs) / 1e6 < 100) ||
                          (!seenN && dtMs > Tune.MISS_OUT_MS)
                      if (!seenZ || moved) {
                          hits++
                          if (dtMs < 1500) lat = if (lat < 0) dtMs else lat * 0.7 + dtMs * 0.3
                          waitChange = false
                          newRound()
                      } else if (stillRunning) {
                          misses++
                          waitChange = false
                      } else if (dtMs > 3000) {
                          waitChange = false; resetSweep()
                      } else return
                  }
                  if (nowNs < blockUntilNs) return
                  if (!seenZ) { resetSweep(); return }
                  if (!haveE) return

                  // [ПРОГНОЗ] нужна известная скорость и хотя бы пара шагов с последнего разворота
                  val v = currentSpeed()
                  if (v < Tune.SPEED_MIN_PX_S || swDir == 0 || tkN < Tune.SWEEP_MIN_TICKS) return

                  // уточнённое e в момент последнего шага: усредняем шаги прохода, сдвинутые вперёд по скорости
                  // (так случайная неточность времени одного кадра усредняется)
                  val k = min(tkN, 6)
                  val tL = tkT[tkN - 1]
                  var eHat = 0.0
                  for (i in tkN - k until tkN) eHat += tkE[i] + swDir * v * ((tL - tkT[i]) / 1e9)
                  eHat /= k

                  // сколько px осталось до совпадения (меньше нуля = стрелка уже проехала зону)
                  val remaining = -eHat * swDir
                  if (remaining < 0.0) { lateNoted = false; return }
                  val tCross = tL + (remaining / v * 1e9).toLong()
                  val tFire = tCross - leadMs * 1_000_000L
                  val etaMs = (tFire - nowNs) / 1e6
                  val halfMs = aHalfPx / v * 1000.0

                  if (etaMs > Tune.COMMIT_MS) return                      // рано, ждём свежие кадры
                  if (etaMs < -halfMs * Tune.LATE_TOL_FRAC) {             // опоздали -> ждём следующий проход, лучше не нажимать криво
                      if (!lateNoted) { skippedLate++; lateNoted = true }
                      return
                  }

                  if (etaMs > 0) waitUntil(tFire)
                  click()
                  fireNs = System.nanoTime()
                  blockUntilNs = fireNs + max(cool, 300L) * 1_000_000L
                  waitChange = true; lastZx = aZx; lastZy = aZy
                  fireDir = swDir; fireSpeed = v
                  calibPending = true
                  lastSpeed = v
              }

              // ---------- окна ----------
              // alpha < 0.8: Android 12+ блокирует нажатия сквозь окна непрозрачнее 0.8
              private fun lp(w: Int, h: Int, touch: Boolean, x: Int, y: Int): WindowManager.LayoutParams {
                  val q = WindowManager.LayoutParams(
                      w, h, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          (if (touch) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE),
                      PixelFormat.TRANSLUCENT)
                  q.gravity = Gravity.TOP or Gravity.START
                  q.x = x
                  q.y = y
                  q.alpha = 0.7f
                  if (Build.VERSION.SDK_INT >= 28)
                      q.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  return q
              }

              // точки для прицеливания (двигать круг, менять размер, место нажатия)
              private inner class Handle(col: Int, var x: Int, var y: Int, val onMove: (Int, Int) -> Unit) {
                  val v = View(this@OverlayService).apply {
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(col); setStroke(5, Color.WHITE) }
                  }
                  val p = lp(S, S, true, x, y)
                  var attached = false
                  init {
                      var sx = 0f; var sy = 0f; var ox = 0; var oy = 0
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { sx = e.rawX; sy = e.rawY; ox = x; oy = y }
                              MotionEvent.ACTION_MOVE -> {
                                  moveTo(ox + (e.rawX - sx).toInt(), oy + (e.rawY - sy).toInt()); onMove(x, y)
                              }
                              MotionEvent.ACTION_UP -> save()
                          }
                          true
                      }
                  }
                  fun show() { if (!attached) { try { wm.addView(v, p); attached = true } catch (e: Exception) {} } }
                  fun hide() { if (attached) { try { wm.removeView(v) } catch (e: Exception) {}; attached = false } }
                  fun moveTo(nx: Int, ny: Int) { x = nx; y = ny; p.x = nx; p.y = ny; if (attached) wm.updateViewLayout(v, p) }
                  fun resize() { p.width = S; p.height = S }
              }

              private fun relayout() {
                  frameP.x = fx; frameP.y = fy; frameP.width = fw; frameP.height = fh
                  wm.updateViewLayout(frameV, frameP)
                  val r = fw / 2
                  val k = (r * 0.707f).toInt()
                  moveH.moveTo(fx + r - k - S / 2, fy + r - k - S / 2)
                  sizeH.moveTo(fx + r + k - S / 2, fy + r + k - S / 2)
              }

              private fun relayoutAll() {
                  relayout()
                  targetH.moveTo(tx - S / 2, ty - S / 2)
                  if (!expanded) {
                      hudP.x = hudX; hudP.y = hudY
                      hudP.width = bubbleSize(); hudP.height = bubbleSize()
                      wm.updateViewLayout(hudRoot, hudP)
                  }
              }

              private fun applyAim() {
                  if (aiming && !running) {
                      moveH.show(); sizeH.show(); targetH.show()
                      relayoutAll()
                  } else {
                      moveH.hide(); sizeH.hide(); targetH.hide()
                  }
              }

              private fun aimAction() {
                  if (running) toggle()
                  aiming = !aiming
                  applyAim()
                  collapse()
              }

              private fun cycleSize() {
                  collapse(false)
                  bubbleStep = (bubbleStep + 1) % 3
                  val b = bubbleSize()
                  val q = bubble.layoutParams as FrameLayout.LayoutParams
                  q.width = b; q.height = b
                  bubble.layoutParams = q
                  moveH.resize(); sizeH.resize(); targetH.resize()
                  clampAll()
                  relayoutAll()
                  save()
              }

              // ---------- кружок ----------
              private inner class BubbleView : View(this@OverlayService) {
                  private val pr = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var phase = 0f
                  private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 1000
                      repeatCount = ValueAnimator.INFINITE
                      addUpdateListener { phase = it.animatedValue as Float; invalidate() }
                  }

                  fun sync() {
                      if (running) { if (!anim.isRunning) anim.start() } else { anim.cancel(); phase = 0f; invalidate() }
                  }

                  override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

                  override fun onDraw(c: Canvas) {
                      val w = width.toFloat()
                      val m = w / 2f
                      val base = m * 0.80f
                      val green = Color.parseColor("#00E676")
                      if (running) {
                          pr.style = Paint.Style.STROKE; pr.strokeWidth = m * 0.10f; pr.color = green
                          pr.alpha = (200 * (1f - phase)).toInt()
                          c.drawCircle(m, m, base + (m - base) * phase, pr)
                      }
                      pr.style = Paint.Style.FILL; pr.color = Color.parseColor("#F2151A21")
                      c.drawCircle(m, m, base, pr)
                      pr.style = Paint.Style.STROKE; pr.strokeWidth = m * 0.10f
                      pr.color = if (running) green else Color.WHITE
                      c.drawCircle(m, m, base, pr)
                      val col = color
                      pr.style = Paint.Style.FILL
                      if (contactMode) {
                          val rc = RectF(m - base * 0.58f, m - base * 0.58f, m + base * 0.58f, m + base * 0.58f)
                          pr.color = col; c.drawArc(rc, 90f, 180f, true, pr)
                          pr.color = color2; c.drawArc(rc, -90f, 180f, true, pr)
                      } else {
                          pr.color = col
                          c.drawCircle(m, m, base * 0.58f, pr)
                      }
                      val lum = Color.red(col) * 0.3 + Color.green(col) * 0.6 + Color.blue(col) * 0.1
                      pr.color = if (lum > 140) Color.BLACK else Color.WHITE
                      if (running) {
                          val s = base * 0.22f
                          c.drawRoundRect(RectF(m - s, m - s, m + s, m + s), s * 0.25f, s * 0.25f, pr)
                      } else {
                          val s = base * 0.26f
                          val path = Path()
                          path.moveTo(m - s * 0.7f, m - s)
                          path.lineTo(m + s, m)
                          path.lineTo(m - s * 0.7f, m + s)
                          path.close()
                          c.drawPath(path, pr)
                      }
                      if (running && contactMode) {
                          // три точки: стрелка видна / слежение готово (скорость и направление известны) / зона видна
                          pr.style = Paint.Style.FILL
                          pr.color = if (seenN) color else Color.DKGRAY
                          c.drawCircle(m - m * 0.42f, w * 0.93f, m * 0.13f, pr)
                          pr.color = if (ready) Color.parseColor("#00E676") else Color.DKGRAY
                          c.drawCircle(m, w * 0.93f, m * 0.13f, pr)
                          pr.color = if (seenZ) color2 else Color.DKGRAY
                          c.drawCircle(m + m * 0.42f, w * 0.93f, m * 0.13f, pr)
                      }
                      if (ClickerAccessibility.inst == null) {
                          pr.style = Paint.Style.FILL; pr.color = Color.parseColor("#E53935")
                          c.drawCircle(w * 0.84f, w * 0.16f, m * 0.24f, pr)
                          pr.style = Paint.Style.STROKE; pr.strokeWidth = m * 0.05f; pr.color = Color.WHITE
                          c.drawCircle(w * 0.84f, w * 0.16f, m * 0.24f, pr)
                      }
                  }
              }

              private fun attachBubbleTouch(v: View) {
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var downX = 0f; var downY = 0f; var sx = 0; var sy = 0
                  var moved = false
                  var longDone = false
                  val longRun = Runnable {
                      longDone = true
                      v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                      if (expanded) collapse() else expand()
                  }
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX; downY = e.rawY; sx = hudX; sy = hudY
                              moved = false; longDone = false
                              ui.postDelayed(longRun, 380)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!moved && (abs(dx) > slop || abs(dy) > slop)) { moved = true; ui.removeCallbacks(longRun) }
                              if (moved && !expanded) {
                                  hudX = sx + dx.toInt(); hudY = sy + dy.toInt()
                                  hudP.x = hudX; hudP.y = hudY
                                  wm.updateViewLayout(hudRoot, hudP)
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              ui.removeCallbacks(longRun)
                              if (moved && !expanded) snap()
                              else if (!moved && !longDone) { if (expanded) collapse() else toggle() }
                          }
                          MotionEvent.ACTION_CANCEL -> ui.removeCallbacks(longRun)
                      }
                      true
                  }
              }

              // прилипание кружка к краю экрана
              private fun snap() {
                  val b = bubbleSize()
                  val targetX = if (hudX + b / 2 < W / 2) 0 else W - b
                  val targetY = hudY.coerceIn(0, max(0, H - b))
                  val fromX = hudX
                  val fromY = hudY
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 220
                      interpolator = DecelerateInterpolator()
                      addUpdateListener {
                          val t = it.animatedValue as Float
                          hudX = (fromX + (targetX - fromX) * t).toInt()
                          hudY = (fromY + (targetY - fromY) * t).toInt()
                          if (!expanded) {
                              hudP.x = hudX; hudP.y = hudY
                              try { wm.updateViewLayout(hudRoot, hudP) } catch (e: Exception) {}
                          }
                      }
                      start()
                  }
                  save()
              }

              private fun roundBtn(label: String, bg: Int, size: Int): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.gravity = Gravity.CENTER
                  t.setTextColor(Color.WHITE)
                  t.setTextSize(TypedValue.COMPLEX_UNIT_PX, size * 0.46f)
                  t.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(bg); setStroke(3, Color.WHITE) }
                  t.layoutParams = FrameLayout.LayoutParams(size, size, Gravity.CENTER)
                  return t
              }

              private fun addMenu(v: View, mx: Float, my: Float, i: Int, onClick: () -> Unit, onLong: (() -> Unit)?) {
                  v.scaleX = 0f; v.scaleY = 0f; v.alpha = 0f
                  v.setOnClickListener {
                      v.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                      onClick()
                  }
                  if (onLong != null) v.setOnLongClickListener { onLong(); true }
                  hudRoot.addView(v)
                  menuViews.add(v)
                  v.animate().translationX(mx).translationY(my).scaleX(1f).scaleY(1f).alpha(1f)
                      .setStartDelay(i * 22L).setDuration(240).setInterpolator(OvershootInterpolator(1.4f)).start()
              }

              private fun expand() {
                  if (expanded) return
                  expanded = true
                  val b = bubbleSize()
                  val m = (b * 4.9f).toInt()
                  val cx = (hudX + b / 2).coerceIn(m / 2, max(m / 2, W - m / 2))
                  val cy = (hudY + b / 2).coerceIn(m / 2, max(m / 2, H - m / 2))
                  hudP.width = m; hudP.height = m
                  hudP.x = cx - m / 2; hudP.y = cy - m / 2
                  wm.updateViewLayout(hudRoot, hudP)

                  val a = (b * 0.78f).toInt()
                  val d = (b * 0.6f).toInt()
                  val r1 = b * 1.35f
                  val r2 = b * 2.05f
                  val acts = listOf(
                      Act("💧", Color.parseColor("#1E88E5"), -135) { startPipette() },
                      Act("🎯", Color.parseColor("#43A047"), -45) { aimAction() },
                      Act("🔍", Color.parseColor("#8E24AA"), 135) { cycleSize() },
                      Act("✕", Color.parseColor("#E53935"), 45) { stopSelf() },
                      Act(if (contactMode) "⚡" else "◉", Color.parseColor("#F9A825"), 90) {
                          contactMode = !contactMode
                          save(); bubble.invalidate()
                          toast(if (contactMode) "Режим: контакт двух цветов (стрелка + зона)" else "Режим: один цвет")
                          collapse()
                      },
                      Act("⏪", Color.parseColor("#FB8C00"), 180) {
                          leadMs = min(Tune.LEAD_MAX_MS, leadMs + Tune.LEAD_STEP_MS); save()
                          toast("Упреждение $leadMs мс — жмёт раньше"); keepMenu()
                      },
                      Act("⏩", Color.parseColor("#FB8C00"), 0) {
                          leadMs = max(0, leadMs - Tune.LEAD_STEP_MS); save()
                          toast("Упреждение $leadMs мс — жмёт позже"); keepMenu()
                      }
                  )
                  var i = 0
                  for (act in acts) {
                      val v = roundBtn(act.label, act.bg, a)
                      val rad = Math.toRadians(act.deg.toDouble())
                      addMenu(v, (r1 * cos(rad)).toFloat(), (r1 * sin(rad)).toFloat(), i++, { act.onClick() }, null)
                  }
                  for ((k, c) in palette.withIndex()) {
                      val v = roundBtn("", c, d)
                      (v.background as GradientDrawable).setStroke(if (c == color) 8 else 3, Color.WHITE)
                      val rad = Math.toRadians(-90.0 + k * 45.0)
                      addMenu(v, (r2 * cos(rad)).toFloat(), (r2 * sin(rad)).toFloat(), i++,
                          { color = c; save(); bubble.invalidate(); collapse() },
                          { palette.removeAll { it == c }; save(); collapse(false); expand() })
                  }
                  bubble.bringToFront()
                  keepMenu()
              }

              private fun collapse(animated: Boolean = true) {
                  if (!expanded) return
                  expanded = false
                  ui.removeCallbacks(menuClose)
                  val finish = Runnable {
                      if (!expanded) {
                          for (v in menuViews) hudRoot.removeView(v)
                          menuViews.clear()
                          hudP.width = bubbleSize(); hudP.height = bubbleSize()
                          hudP.x = hudX; hudP.y = hudY
                          try { wm.updateViewLayout(hudRoot, hudP) } catch (e: Exception) {}
                      }
                  }
                  if (!animated || menuViews.isEmpty()) { finish.run(); return }
                  for (v in menuViews)
                      v.animate().translationX(0f).translationY(0f).scaleX(0f).scaleY(0f).alpha(0f)
                          .setStartDelay(0).setDuration(140).start()
                  ui.postDelayed(finish, 160)
              }

              // ---------- пипетка с лупой ----------
              private inner class PipetteView : View(this@OverlayService) {
                  private val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var fxp = -1f
                  private var fyp = -1f
                  private var cc = 0
                  private var cells: IntArray? = null

                  override fun onDraw(c: Canvas) {
                      val d = resources.displayMetrics.density
                      val w = width.toFloat()
                      val hint = if (!contactMode) "Коснись нужного цвета и отпусти"
                          else if (pipStep == 1) "1 из 2: коснись СТРЕЛКИ (тонкой линии)"
                          else "2 из 2: коснись ЗОНЫ (подсвеченной области)"
                      p.textSize = 14 * d; p.textAlign = Paint.Align.CENTER
                      val tw = p.measureText(hint)
                      p.style = Paint.Style.FILL; p.color = Color.parseColor("#CC000000")
                      c.drawRoundRect(RectF(w / 2f - tw / 2f - 20 * d, 40 * d, w / 2f + tw / 2f + 20 * d, 84 * d), 22 * d, 22 * d, p)
                      p.color = Color.WHITE
                      c.drawText(hint, w / 2f, 68 * d, p)
                      p.color = Color.parseColor("#CCE53935")
                      c.drawCircle(w - 40 * d, 62 * d, 24 * d, p)
                      p.color = Color.WHITE; p.textSize = 20 * d
                      c.drawText("✕", w - 40 * d, 69 * d, p)

                      val g = cells
                      if (fxp >= 0f && g != null) {
                          val n = 11
                          val cs = 9 * d
                          val size = n * cs
                          var top = fyp - 140 * d - size / 2f
                          if (top < 100 * d) top = fyp + 70 * d
                          val left = (fxp - size / 2f).coerceIn(8 * d, w - size - 8 * d)
                          p.style = Paint.Style.FILL; p.color = Color.parseColor("#EE000000")
                          c.drawRect(left - 3 * d, top - 3 * d, left + size + 3 * d, top + size + 3 * d, p)
                          for (i in 0 until n * n) {
                              val v = g[i]
                              p.color = if (v == 0) Color.DKGRAY else v
                              val cx0 = left + (i % n) * cs
                              val cy0 = top + (i / n) * cs
                              c.drawRect(cx0, cy0, cx0 + cs, cy0 + cs, p)
                          }
                          val mc = n / 2
                          p.style = Paint.Style.STROKE; p.strokeWidth = 2 * d; p.color = Color.WHITE
                          c.drawRect(left + mc * cs, top + mc * cs, left + (mc + 1) * cs, top + (mc + 1) * cs, p)
                          p.style = Paint.Style.FILL; p.color = cc
                          c.drawCircle(left + size / 2f, top + size + 26 * d, 16 * d, p)
                          p.style = Paint.Style.STROKE; p.color = Color.WHITE
                          c.drawCircle(left + size / 2f, top + size + 26 * d, 16 * d, p)
                          c.drawCircle(fxp, fyp, 14 * d, p)
                      }
                  }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      val d = resources.displayMetrics.density
                      val rx = e.rawX.toInt()
                      val ry = e.rawY.toInt()
                      when (e.action) {
                          MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {
                              fxp = e.x; fyp = e.y
                              cells = grid(rx, ry, 11)
                              cc = smartPick(rx, ry)
                              invalidate()
                          }
                          MotionEvent.ACTION_UP -> {
                              val cancel = e.x > width - 80 * d && e.y < 110 * d
                              val got = smartPick(rx, ry)
                              ui.post { endPipette(if (cancel) null else got) }
                          }
                      }
                      return true
                  }
              }

              private fun startPipette() {
                  if (pipette != null) return
                  collapse(false)
                  pipStep = 1
                  val v = PipetteView()
                  pipette = v
                  val q = lp(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, true, 0, 0)
                  q.alpha = 0.78f
                  try { wm.addView(v, q) } catch (e: Exception) { pipette = null; return }
                  ui.postDelayed({ if (pipette === v) closePipette() }, 30000)
              }

              private fun closePipette() {
                  val v = pipette ?: return
                  pipette = null
                  try { wm.removeView(v) } catch (e: Exception) {}
              }

              private fun endPipette(c: Int?) {
                  val v = pipette ?: return
                  if (c == null) { closePipette(); return }
                  if (c == 0) { toast("Не удалось взять цвет, попробуй ещё раз"); return }
                  addPalette(c)
                  if (!contactMode) {
                      color = c
                      closePipette()
                      toast("Цвет сохранён и выбран")
                  } else if (pipStep == 1) {
                      color = c
                      pipStep = 2
                      v.invalidate()
                      toast("Стрелка выбрана. Теперь коснись зоны")
                  } else {
                      color2 = c
                      closePipette()
                      toast("Готово: стрелка и зона выбраны")
                  }
                  save()
                  bubble.invalidate()
              }

              // ---------- сборка интерфейса ----------
              private fun buildOverlay() {
                  frameV = View(this).apply {
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.TRANSPARENT); setStroke(4, Color.parseColor("#00FF66")) }
                  }
                  frameP = lp(fw, fh, false, fx, fy)
                  wm.addView(frameV, frameP)

                  moveH = Handle(Color.parseColor("#00CC55"), fx, fy) { x, y ->
                      val r = fw / 2
                      val k = (r * 0.707f).toInt()
                      fx = x + S / 2 + k - r; fy = y + S / 2 + k - r; relayout()
                  }
                  sizeH = Handle(Color.WHITE, fx, fy) { x, y ->
                      val r = ((x + S / 2 - fx) + (y + S / 2 - fy)) / 3.4f
                      val d = max(60, (r * 2).toInt())
                      fw = d; fh = d; relayout()
                  }
                  targetH = Handle(Color.parseColor("#FF9900"), tx - S / 2, ty - S / 2) { x, y -> tx = x + S / 2; ty = y + S / 2 }

                  bubble = BubbleView()
                  hudRoot = FrameLayout(this)
                  hudRoot.addView(bubble, FrameLayout.LayoutParams(bubbleSize(), bubbleSize(), Gravity.CENTER))
                  attachBubbleTouch(bubble)
                  hudRoot.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_OUTSIDE) collapse()
                      false
                  }
                  hudP = lp(bubbleSize(), bubbleSize(), true, hudX, hudY)
                  hudP.flags = hudP.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                      WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH
                  hudP.alpha = 0.78f
                  wm.addView(hudRoot, hudP)
                  applyAim()
              }

              // разница между координатами окна и экрана (вырез камеры и т.п.)
              private fun syncPos() {
                  val a = IntArray(2)
                  frameV.getLocationOnScreen(a)
                  val dx = a[0] - frameP.x
                  val dy = a[1] - frameP.y
                  if (abs(dx) < 300 && abs(dy) < 300) { offX = dx; offY = dy }
              }

              private fun toggle() {
                  syncPos()
                  val on = !running
                  if (on) resetTracking()      // до запуска движка, чтобы он не увидел старые данные
                  running = on
                  bubble.sync()
                  bubble.performHapticFeedback(HapticFeedbackConstants.CONTEXT_CLICK)
                  if (running) {
                      aiming = false
                      applyAim()
                  } else {
                      val l = if (lat > 0) lat.toInt().toString() + " мс" else "—"
                      val ln = if (framesAll > 0) framesLine * 100 / framesAll else 0
                      toast("Стоп. Нажатий: $clicks (ок $tapOk, отказ $tapFail), попаданий: $hits, промахов: $misses, " +
                          "пропущено как «поздно»: $skippedLate, лаг: $l, упреждение: $leadMs мс, " +
                          "скорость ${lvl + 1}/5, разворотов: $turns, линия стрелки найдена в $ln% кадров")
                  }
              }

              private fun tickStatus() {
                  if (!alive) return
                  if (!running) syncPos()
                  bubble.invalidate()
                  ui.postDelayed({ tickStatus() }, 400)
              }

              override fun onDestroy() {
                  alive = false; running = false
                  ui.removeCallbacksAndMessages(null)
                  if (::hudRoot.isInitialized) save()
                  closePipette()
                  if (::moveH.isInitialized) { moveH.hide(); sizeH.hide(); targetH.hide() }
                  if (::frameV.isInitialized) try { wm.removeView(frameV) } catch (e: Exception) {}
                  if (::hudRoot.isInitialized) try { wm.removeView(hudRoot) } catch (e: Exception) {}
                  synchronized(lock) { cur?.close(); cur = null }
                  vd?.release(); reader?.close(); projection?.stop()
                  super.onDestroy()
              }
          }
          EOF_TC
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_TC'
          <resources>
              <string name="a11y_desc">Нужна только чтобы делать нажатия по экрану в нужный момент.</string>
          </resources>
          EOF_TC
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_TC'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:isAccessibilityTool="true"
              android:description="@string/a11y_desc"/>
          EOF_TC
          cat > build.gradle.kts <<'EOF_TC'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_TC
          cat > gradle.properties <<'EOF_TC'
          org.gradle.jvmargs=-Xmx2g
          EOF_TC
          cat > settings.gradle.kts <<'EOF_TC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TriggerClicker"
          include(":app")
          EOF_TC
